name: Verify

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # The deployed site is a different build from the one `check` produces, so it gets
      # its own pass: pre-rendering, discovery files, and the initial-JavaScript budget.
      - run: npm run build:public
        env:
          PETES_PRINTER_PUBLIC_URL: https://openreceipt.example

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e 'bridge[dev]'
      - run: pytest bridge/tests
